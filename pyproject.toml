# The server runs from this checkout (see README); installing the package isn't needed.
[project]
name = "resolve-creative-editor"
version = "1.0.0"
description = "MCP server for editing in DaVinci Resolve, free and Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transcription = ["faster-whisper"]
dev = ["ruff", "lupa"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resolve_editor*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor", "logs", "patches"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"resolve_editor/schemas/common.py" = ["E741"]  # S, I, B, N: one-letter shorthands for JSON schema types
"tests/smoke_bridge.py" = ["E731"]  # lambdas stand in for Resolve API functions in the fake Lua tables

[tool.ruff.lint.isort]
known-first-party = ["resolve_editor"]
# tests.support must be imported before resolve_editor: it points the bridge folder at a temporary one (I-14)
section-order = ["future", "standard-library", "third-party", "tests-support", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"tests-support" = ["tests"]
