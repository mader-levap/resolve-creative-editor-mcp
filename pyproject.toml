# The server runs from this checkout (see README); installing the package isn't needed.
[project]
name = "resolve-creative-editor"
dynamic = ["version"]
description = "MCP server for editing in DaVinci Resolve, free and Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transcription = ["faster-whisper"]
dev = ["ruff", "mypy", "lupa", "coverage>=7.10"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "resolve_editor.__version__"}

[tool.setuptools.packages.find]
include = ["resolve_editor*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["vendor", "logs", "patches"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"resolve_editor/schemas/common.py" = ["E741"]  # S, I, B, N: one-letter shorthands for JSON schema types
"tests/smoke_bridge.py" = ["E731"]  # lambdas stand in for Resolve API functions in the fake Lua tables

[tool.ruff.lint.isort]
known-first-party = ["resolve_editor"]
# tests.support must be imported before resolve_editor: it points the bridge folder at a temporary one (I-14)
section-order = ["future", "standard-library", "third-party", "tests-support", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"tests-support" = ["tests"]

[tool.coverage.run]
source = ["resolve_editor"]
branch = true
# the gateway and stdio tests start the servers as processes (and the gateway starts the legacy server): measure those too
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.10"
files = ["resolve_editor", "tests", "mcp_server.py", "unified_server.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# package code must be annotated; tests are checked without annotations
module = ["resolve_editor.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "lupa", "lupa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# these talk to a child process through Popen pipes, which typeshed marks optional
module = ["tests.unit.test_gateway", "tests.smoke_bridge"]
disable_error_code = ["union-attr"]
